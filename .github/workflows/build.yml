name: Build ANAS MODDER
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Unzip Project
        run: unzip ANAS_MODDER.zip
        
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        
      - name: Build with Gradle
        run: cd ANAS_MODDER && gradle build
        
      - name: Upload Mod JAR
        uses: actions/upload-artifact@v3
        with:
          name: ANAS-MODDER-JAR
          path: ANAS_MODDER/build/libs/*.jar
